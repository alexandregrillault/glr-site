<!doctype html>

<style>
  :root {

  .choix { display:flex; flex-direction:column; gap:9px; margin-top:16px; }

  .emp { border:1px solid var(--bordure); border-radius:13px; padding:14px 16px 16px; margin-top:14px; background:#fcfbf8; }

  .enregistre .ico { flex:0 0 22px; height:22px; border-radius:50%; background:var(--vert); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; margin-top:1px; }

  footer { text-align:center; color:var(--muted); font-size:12.5px; margin-top:22px; }

  @media (max-width:520px){
    .bloc { padding:20px 18px; }
    .logo { height:52px; }
    .res-montant { font-size:30px; }
  }

<div class="wrap">
  <header><img class="logo" alt="GLR Immobilier" onerror="this.outerHTML='<div class=&quot;marque&quot;>GLR IMMOBILIER</div>'"><div class="filet"></div></header>
  <script>
    (function(){ var i = document.querySelector("img.logo"); if (i) i.src = /glrimmobilier\.com$/i.test(location.hostname) ? "/rdv/logo-glr.png" : "../logo-glr.png"; })();
  </script>
  <div id="contenu"><div class="etat-vide">Chargement…</div></div>
  <footer>GLR Immobilier — <a href="https://www.glrimmobilier.com" target="_blank" rel="noopener">glrimmobilier.com</a></footer>

<script>
/* =====================================================================
   « Mon budget en 2 minutes » — page client, lien personnel ?t=<jeton>
   (le même jeton que la page de rendez-vous : rdv_liens.token).

   Le client répond à 7 questions, voit le budget qu'il peut viser, et le
   résultat s'enregistre sur sa fiche (contacts.simulations, origine
   « client »), au même format que le simulateur du CRM : le vendeur qui
   ouvre ensuite le simulateur pour ce client retrouve ses réponses.

   Le CALCUL est celui du simulateur du CRM (glrimmobilier/simulateur.html),
   recopié à l'identique : barèmes, aides, capacité. Toute évolution d'un
   barème se fait dans les deux fichiers.
   ===================================================================== */

/* ===================== BARÈMES (copie de simulateur.html) ===================== */
const BAR = {
  ptz: {
    plafRess: { abis:[49000,73500,88200,102900,117600,132300,147000,161700], a:[49000,73500,88200,102900,117600,132300,147000,161700], b1:[34500,51750,62100,72450,82800,93150,103500,113850] },
    plafOp:   { abis:[150000,225000,270000,315000,360000], a:[150000,225000,270000,315000,360000], b1:[135000,202500,243000,283500,324000] },
    coef:[1,1.5,1.8,2.1,2.4,2.7,3.0,3.3],
    tranches:{ abis:[25000,31000,37000], a:[25000,31000,37000], b1:[21500,26000,30000] },
    quotColl:[0.5,0.4,0.4,0.2], quotInd:[0.3,0.2,0.2,0.1],
    duree:[25,20,15,10], differe:[10,8,2,0]
  },
  pal: { max:30000, partMax:0.40, dureeMax:25,
    plaf:{ abis:[43953,65691,86112,102812,122326,137649], a:[43953,65691,78963,94585,111971,126001], b1:[35825,47842,57531,69455,81705,92080] },
    plafSup:{ abis:15335, a:14039, b1:10273 } },
  ppl: { m1:24200, m2:39600, duree:15, plaf:[38907,54891,71953,85906,102209] },
  tva: {
    paris:[34996,52303,68562,81858,97395,109595], parisSup:12212,
    idf:[34996,52303,62871,75309,89150,100322], idfSup:11177, majo:1.11 }
};
const COMMUNES_LIMITROPHES_PARIS = ['boulogne-billancourt','neuilly-sur-seine','levallois-perret','clichy','saint-ouen-sur-seine','saint-ouen','saint-mande','vincennes','montrouge','malakoff','vanves','issy-les-moulineaux','pantin','le pre-saint-gervais','pre-saint-gervais','ivry-sur-seine','charenton-le-pont','le kremlin-bicetre','kremlin-bicetre'];
function _normCommune(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); }
function zoneDepuisCommune(commune, codePostal){
  const c = _normCommune(commune);
  const dep = String(codePostal||'').slice(0,2);
  if (c === 'paris' || dep === '75') return 'paris';
  if (COMMUNES_LIMITROPHES_PARIS.indexOf(c) !== -1) return 'limitrophe';
  if (['92','93','94'].indexOf(dep) !== -1) return 'a';
  if (['77','78','91','95'].indexOf(dep) !== -1) return 'b1';
  return null;
}
// Part des revenus retenue par la banque (copie de REGLES du simulateur)
const PART_REVENUS = { cdi:1, cdi_essai:1, cdd:1, alternant:0, etudiant:0, indep:1, public:1, retraite:1, sans:0 };

/* Paramètres de calcul : valeurs par défaut du simulateur ; les taux sont
   remplacés par le baromètre du jour (edge function taux-marche) s'il répond. */
const P = { t:{15:0.0328,20:0.034,25:0.036}, ass:0.0034, endet:0.35, fNot:0.025, fGar:0.01, pLoyer:0.70, tPAL:0.01, ageFin:75, ravAdulte:800, ravEnfant:300 };
let TAUX_DATE = null;

/* ===================== FORMULES (copie de simulateur.html) ===================== */
function mens(C,taux,ans){ const n=ans*12, r=taux/12; if(C<=0) return 0; if(r===0) return C/n; return C*r/(1-Math.pow(1+r,-n)); }
function schedAide(C,taux,dureeTot,differe){ const n=dureeTot*12, d=differe*12, out=[]; const m=mens(C,taux,dureeTot-differe); for(let i=1;i<=n;i++) out.push(i<=d?0:m); return out; }
function capitalLisse(M,taux,ans,ass,aides){ const n=ans*12, r=taux/12; let A=0,B=0; for(let t=1;t<=n;t++){ const v=Math.pow(1+r,-t); A+=v; let a=0; aides.forEach(s=>{a+=(s[t-1]||0)}); B+=a*v; } const C=(M*A-B)/(1+ass/12*A); return Math.max(0,C); }
function mensLisse(C,taux,ans,ass,aides){ const n=ans*12, r=taux/12; let A=0,B=0; for(let t=1;t<=n;t++){ const v=Math.pow(1+r,-t); A+=v; let a=0; aides.forEach(s=>{a+=(s[t-1]||0)}); B+=a*v; } return (C*(1+ass/12*A)+B)/A; }
function interets(C,taux,ans){ return mens(C,taux,ans)*ans*12-C; }
function zoneKey(z){ return (z==='paris'||z==='limitrophe'||z==='abis')?'abis':z; }
function idx(foyer,max){ return Math.min(foyer,max)-1; }
// Espace insécable classique entre les milliers (l'espace fine de toLocaleString manque à certaines polices)
const milliers = v=>Math.round(v).toLocaleString('fr-FR').replace(/\u202f/g,'\u00a0');
const eur = v=>milliers(v)+'\u00a0€';
const eurM = v=>milliers(v)+'\u00a0€/mois';

function ptz(cl, lot){
  const z=zoneKey(lot.zone), f=cl.foyer, r={ok:false,montant:0,raisons:[]};
  if(cl.projet!=='rp'){r.raisons.push('réservé à la résidence principale');return r;}
  if(!cl.primo){r.raisons.push('pas primo-accédant');return r;}
  const plafR=BAR.ptz.plafRess[z][idx(f,8)];
  const revenu=Math.max(cl.rfr, lot.cout/9);
  if(revenu>plafR){r.raisons.push('RFR > plafond');return r;}
  const q=revenu/BAR.ptz.coef[idx(f,8)], s=BAR.ptz.tranches[z];
  const tr = q<=s[0]?0 : q<=s[1]?1 : q<=s[2]?2 : 3;
  const plafOp=BAR.ptz.plafOp[z][idx(f,5)];
  const quot=(lot.type==='ind'?BAR.ptz.quotInd:BAR.ptz.quotColl)[tr];
  r.ok=true; r.tranche=tr+1; r.quot=quot; r.base=Math.min(lot.cout,plafOp); r.montant=Math.round(r.base*quot);
  r.duree=BAR.ptz.duree[tr]; r.differe=BAR.ptz.differe[tr]; r.plafOp=plafOp; r.plafR=plafR; r.revenuRetenu=revenu; r.plancher = lot.cout/9>cl.rfr;
  return r;
}
function pal(cl, lot, p){
  const z=zoneKey(lot.zone), f=cl.foyer, r={ok:false,montant:0,raisons:[]};
  if(cl.projet!=='rp'){r.raisons.push('réservé à la résidence principale');return r;}
  if(!cl.salarie){r.raisons.push('aucun emprunteur salarié du privé');return r;}
  if(!cl.primo){r.raisons.push('pas primo-accédant');return r;}
  const t=BAR.pal.plaf[z]; const plaf= f<=6? t[f-1] : t[5]+(f-6)*BAR.pal.plafSup[z];
  if(cl.rfr>plaf){r.raisons.push('RFR > plafond');return r;}
  r.ok=true; r.montant=Math.round(Math.min(BAR.pal.max, BAR.pal.partMax*lot.cout)); r.duree=Math.min(BAR.pal.dureeMax, cl.duree); r.taux=p.tPAL; r.plaf=plaf; return r;
}
function ppl(cl, lot, majore){
  const r={ok:false,montant:0,raisons:[]}, f=cl.foyer;
  if(cl.projet!=='rp'){r.raisons.push('réservé à la résidence principale');return r;}
  if(lot.zone!=='paris'){r.raisons.push('lot hors Paris');return r;}
  if(!cl.parisLoc){r.raisons.push('ne réside pas à Paris depuis 12 mois');return r;}
  if(!cl.primo){r.raisons.push('pas primo-accédant');return r;}
  const plaf=BAR.ppl.plaf[idx(f,5)];
  if(cl.rfr>plaf){r.raisons.push('RFR > plafond');return r;}
  r.ok=true; r.montant= (f>=2?BAR.ppl.m2:BAR.ppl.m1)*(majore?1.5:1); r.majore=!!majore; r.duree=BAR.ppl.duree; r.plaf=plaf; return r;
}
function tva55(cl, lot){
  const r={ok:false,raisons:[]}, f=cl.foyer;
  if(cl.projet!=='rp'){r.raisons.push('réservé à la résidence principale');return r;}
  if(!lot.qpv){r.raisons.push('programme hors QPV/ANRU');return r;}
  const t=(lot.zone==='paris'||lot.zone==='limitrophe')?BAR.tva.paris:BAR.tva.idf, sup=(lot.zone==='paris'||lot.zone==='limitrophe')?BAR.tva.parisSup:BAR.tva.idfSup;
  const plaf=Math.round((f<=6? t[f-1] : t[5]+(f-6)*sup)*BAR.tva.majo);
  if(cl.rfr>plaf){r.raisons.push('RFR > plafond');return r;}
  r.ok=true; r.plaf=plaf; return r;
}
function montage(cl, lot, p){
  const taux=p.t[cl.duree];
  const tv=tva55(cl,lot);
  const prix = tv.ok ? lot.prix/1.20*1.055 : lot.prix;
  const ecoTVA = tv.ok ? lot.prix-prix : 0;
  const L={cout:prix, zone:lot.zone, type:lot.type};
  const aPTZ=ptz(cl,L), aPAL=pal(cl,L,p);
  let aPPL=ppl(cl,L,false);
  const notaire=prix*p.fNot;
  let apport=cl.apport;
  if(aPPL.ok && apport>0.10*prix){ apport=0.10*prix; }
  const besoin = prix+notaire-apport;
  const p0 = Math.min(cl.pret0, Math.max(0,besoin));
  let ptzM=aPTZ.montant, palM=aPAL.montant, pplM=aPPL.montant;
  const calc=()=>{ let pr = besoin - ptzM - palM - pplM - p0; pr += Math.max(0,pr)*p.fGar; return Math.max(0,pr); };
  let principal=calc();
  if(aPPL.ok && (principal+palM+ptzM+p0-BAR.ppl.m1) > 0.5*prix){ aPPL=ppl(cl,L,true); pplM=aPPL.montant; principal=calc(); }
  if(aPTZ.ok && ptzM > principal+palM+pplM+p0){ ptzM=Math.max(0,Math.floor(principal+palM+pplM+p0)); principal=calc(); }
  const aides=[]; if(aPTZ.ok&&ptzM>0) aides.push(schedAide(ptzM,0,aPTZ.duree,aPTZ.differe)); if(aPAL.ok) aides.push(schedAide(palM,aPAL.taux,aPAL.duree,0)); if(aPPL.ok) aides.push(schedAide(pplM,0,aPPL.duree,0)); if(p0>0) aides.push(schedAide(p0,0,Math.min(cl.pret0Duree,cl.duree),0));
  const M = mensLisse(principal,taux,cl.duree,p.ass,aides);
  return {prix,ecoTVA,tv,aPTZ,aPAL,aPPL,ptzM,palM,pplM,p0,notaire,apport,principal,M,taux};
}
function capacite(cl,p){
  const taux=p.t[cl.duree];
  const Mmax = Math.max(0, cl.revenus*p.endet - cl.credits);
  const Cmax = capitalLisse(Mmax,taux,cl.duree,p.ass,[]);
  const budgetSans = (Cmax/(1+p.fGar)+cl.apport)/(1+p.fNot);
  const maxPrix=(qpv)=>{ const hi=Math.max(budgetSans*2.5,150000); const lot={zone:cl.zone,type:'coll',qpv,prix:0}; let best=0, bm=null;
    for(let x=1000;x<=hi;x+=1000){ lot.prix=x; const m=montage(cl,lot,p); if(m.M<=Mmax){best=x;bm=m;} }
    let lo=best, hi2=best+1000; for(let i=0;i<12;i++){ const mid=(lo+hi2)/2; lot.prix=mid; const m=montage(cl,lot,p); if(m.M<=Mmax){lo=mid;bm=m;} else hi2=mid; }
    return {prix:lo, m:bm}; };
  const r1=maxPrix(false); const budgetAvec=r1.prix, best=r1.m;
  let budgetQPV=null; const r2=maxPrix(true); if(r2.m&&r2.m.tv.ok) budgetQPV={prixAffiche:r2.prix, prixPaye:r2.m.prix};
  return {Mmax,Cmax,budgetSans,budgetAvec,best,budgetQPV,taux};
}
// Tableau « Comment on arrive à ce montant » : mêmes lignes que le simulateur,
// donc le même tableau que la feuille sélection affichera ensuite.
function lignesMontageBudget(c,p,cl){
  const m=c.best; if(!m) return null;
  const L=[];
  L.push({l:'Revenus nets retenus par la banque', v:eurM(cl.revenus)});
  L.push({l:'Mensualité retenue ('+Math.round(p.endet*100)+' % − crédits en cours)', v:eurM(c.Mmax)});
  L.push({l:'Prêt bancaire principal ('+cl.duree+' ans, '+(c.taux*100).toFixed(2).replace('.',',')+' % + assurance '+(p.ass*100).toFixed(2).replace('.',',')+' %)', v:eur(m.principal)});
  if(m.ptzM>0) L.push({l:'PTZ (tranche '+m.aPTZ.tranche+', '+Math.round(m.aPTZ.quot*100)+' % de '+eur(m.aPTZ.base)+', différé '+m.aPTZ.differe+' ans, '+m.aPTZ.duree+' ans)'+(m.aPTZ.plancher?' — revenu retenu = coût/9, le RFR étant plus bas':''), v:eur(m.ptzM)});
  if(m.aPAL.ok) L.push({l:'Prêt Action Logement ('+(m.aPAL.taux*100).toFixed(1).replace('.',',')+' %, '+m.aPAL.duree+' ans)', v:eur(m.palM)});
  if(m.aPPL.ok) L.push({l:'Prêt Paris Logement'+(m.aPPL.majore?' majoré':'')+' (0 %, 15 ans)', v:eur(m.pplM)});
  L.push({l:'Apport (personnel + famille)', v:eur(m.apport)});
  L.push({l:'− Frais de notaire ('+(p.fNot*100).toFixed(1).replace('.',',')+' %) et garantie ('+(p.fGar*100).toFixed(1).replace('.',',')+' % du prêt)', v:'− '+eur(m.notaire+m.principal*p.fGar/(1+p.fGar)), c:'sub'});
  L.push({l:'Prix du logement', v:eur(c.budgetAvec), c:'total'});
  const note='Le PTZ est calculé sur le coût plafonné de l\'opération dans la zone choisie ('+eur(m.aPTZ.plafOp||0)+' pour '+cl.foyer+' personne'+(cl.foyer>1?'s':'')+'). Mensualité lissée : le client paie la même somme tous les mois, y compris quand le PTZ commence à se rembourser. Reste à vivre attendu par les banques pour ce foyer : '+eurM(cl.rav)+'.';
  return { lignes:L, note, budgetAvec:Math.round(c.budgetAvec), budgetSans:Math.round(c.budgetSans) };
}

/* Revenu fiscal de référence : le client ne le connaît presque jamais.
   Estimation : revenus nets annuels × 0,92 (abattement de 10 % sur le net
   imposable, un peu supérieur au net perçu). Le vendeur l'ajuste ensuite
   dans le simulateur, sur l'avis d'imposition. */
const COEF_RFR = 0.92;

// Profil client au format attendu par le moteur (équivalent de client() du simulateur)
function profil(){
  const emps = R.emp.slice(0, R.nb || 1);
  let revenus = 0, salarie = 0, ageMax = 0, revTous = 0;
  emps.forEach(e => {
    const part = PART_REVENUS[e.statut] != null ? PART_REVENUS[e.statut] : 1;
    revenus += num(e.rev) * part; revTous += num(e.rev);
    if (['cdi','cdi_essai','cdd','alternant'].indexOf(e.statut) !== -1 && e.prive) salarie = 1;
    ageMax = Math.max(ageMax, num(e.age) || 0);
  });
  const primo = R.logement !== 'proprio';
  const dureeMaxAge = Math.max(5, Math.min(25, P.ageFin - (ageMax || 30)));
  const duree = dureeMaxAge >= 25 ? 25 : (dureeMaxAge >= 20 ? 20 : 15);
  const foyer = Math.max(R.foyer || 1, R.nb || 1);
  return {
    projet: R.projet || 'rp', primo, salarie, parisLoc: R.parisLoc ? 1 : 0,
    foyer, zone: R.zone || 'a', revenus, revTous,
    credits: R.credits ? num(R.creditsMontant) : 0,
    rfr: Math.round(revTous * 12 * COEF_RFR),
    apport: num(R.apport), duree, pret0: 0, pret0Duree: 10, ageMax,
    rav: P.ravAdulte * Math.min(R.nb || 1, 2) + P.ravEnfant * Math.max(0, foyer - (R.nb || 1))
  };
}
function calculer(){
  const cl = profil();
  if (cl.revenus <= 0) return { cl, budget:null };
  if (cl.projet !== 'rp'){
    const Mmax = Math.max(0, cl.revenus*P.endet - cl.credits);
    const Cmax = capitalLisse(Mmax, P.t[cl.duree], cl.duree, P.ass, []);
    const b = (Cmax/(1+P.fGar) + cl.apport)/(1+P.fNot);
    return { cl, budget:b, budgetSans:b, Mmax, c:null, montage:null };
  }
  const c = capacite(cl, P);
  return { cl, budget:c.budgetAvec, budgetSans:c.budgetSans, Mmax:c.Mmax, c, montage: lignesMontageBudget(c, P, cl) };
}

      if (num(e.rev) > 0 && num(e.rev) < 100) return "Les revenus s'indiquent par mois, en euros (ex. 2 800).";
      const a = num(e.age); if (!(a >= 18 && a <= 85)) return "Indiquez l'âge" + (R.nb === 2 ? " de chacun." : ".");
      if (['cdi','cdi_essai','cdd','alternant'].indexOf(e.statut) !== -1 && e.prive == null) return "Dites si l'entreprise est privée et compte 10 salariés ou plus.";
    }
    return "";
  }
  if (nom === 'logement'){
    const l = document.getElementById('loyer'); if (l) R.loyer = l.value;
    return R.logement ? "" : "Choisissez une réponse.";
  }
  if (nom === 'apport'){
    R.apport = document.getElementById('apport').value;
    if (String(R.apport).trim() === "") return "Indiquez un montant, même 0.";
    return "";
  }
  if (nom === 'credits'){
    if (R.credits == null) return "Choisissez une réponse.";
    const c = document.getElementById('creditsMontant'); if (c) R.creditsMontant = c.value;
    if (R.credits === 1 && num(R.creditsMontant) <= 0) return "Indiquez le total de vos mensualités.";
    return "";
  }
  if (nom === 'secteur'){
    if (!R.zone) return "Choisissez un secteur.";
    if (R.zone === 'paris' && R.projet === 'rp' && R.parisLoc == null) return "Dites si vous vivez à Paris depuis au moins un an.";
    return "";
  }
  return "";
}

function rendu(){
  if (etape === 0) cont.innerHTML = htmlAccueil();
  else if (etape === 'res') cont.innerHTML = htmlResultat();
  else cont.innerHTML = htmlEtape(ETAPES[etape-1], etape);
  brancher();
  window.scrollTo(0, 0);
}

function brancher(){
  cont.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const g = b.getAttribute('data-g'), v = b.getAttribute('data-v');
    if (g === 'projet') R.projet = v;
    else if (g === 'nb') R.nb = +v;
    else if (g === 'foyer') R.foyer = +v;
    else if (g === 'logement') R.logement = v;
    else if (g === 'credits') R.credits = +v;
    else if (g === 'zone'){ R.zone = v; R.zoneAuto = false; if (v !== 'paris') R.parisLoc = null; }
    else if (g === 'parisLoc') R.parisLoc = +v;
    else if (g.indexOf('prive') === 0){ R.emp[+g.slice(5)].prive = +v; }
    // Garder ce qui est déjà tapé avant de redessiner
    if (etape === 'res') return;
    const nom = ETAPES[etape-1];
    if (nom === 'revenus'){ for (let i = 0; i < (R.nb||1); i++){ const e=R.emp[i]; e.statut=document.getElementById('st'+i).value; e.rev=document.getElementById('rev'+i).value; e.age=document.getElementById('age'+i).value; } }
    // Un choix simple sans autre question sur l'écran : on passe directement à la suite
    const auto = (nom === 'projet') || (nom === 'logement' && (v === 'heberge' || v === 'proprio')) || (nom === 'credits' && v === '0') || (nom === 'secteur' && !(v === 'paris' && R.projet === 'rp') && g === 'zone') || (g === 'parisLoc');
    if (auto && !lireEtValider(nom)){ suivant(); return; }
    rendu();
    if (nom === 'credits' && v === '1'){ const c = document.getElementById('creditsMontant'); if (c) c.focus(); }
  }));
  cont.querySelectorAll('select[id^=st]').forEach(s => s.addEventListener('change', () => {
    const i = +s.id.slice(2); R.emp[i].statut = s.value;
    const sal = ['cdi','cdi_essai','cdd','alternant'].indexOf(s.value) !== -1;
    document.getElementById('prive'+i).style.display = sal ? '' : 'none';
    if (!sal) R.emp[i].prive = null;
  }));
  cont.querySelectorAll('.raccourcis button').forEach(b => b.addEventListener('click', () => {
    const el = document.getElementById(b.getAttribute('data-pour')); if (el){ el.value = milliers(Number(b.getAttribute('data-val'))); el.focus(); }
  }));
  // Montants lisibles pendant la frappe : 20000 → 20 000
  cont.querySelectorAll('.unit input').forEach(i => i.addEventListener('input', () => {
    const brut = i.value.replace(/[^\d]/g, ''); i.value = brut ? milliers(Number(brut)) : '';
  }));
  const s = document.getElementById('suivant'); if (s) s.addEventListener('click', suivant);
  const p = document.getElementById('precedent'); if (p) p.addEventListener('click', () => { etape = etape - 1; rendu(); });
  const m = document.getElementById('modifier'); if (m) m.addEventListener('click', () => { etape = 1; rendu(); });
  const re = document.getElementById('reessayer'); if (re) re.addEventListener('click', () => { ENREGISTRE = null; rendu(); enregistrer(); });
  const dt = document.getElementById('detail-toggle'); if (dt) dt.addEventListener('click', () => {
    const d = document.getElementById('detail'); const o = d.hidden; d.hidden = !o; dt.setAttribute('aria-expanded', String(o));
  });
  cont.querySelectorAll('input').forEach(i => i.addEventListener('keydown', ev => { if (ev.key === 'Enter'){ ev.preventDefault(); suivant(); } }));
}

function suivant(){
  if (etape === 0){ etape = 1; rendu(); return; }
  const nom = ETAPES[etape-1];
  const err = lireEtValider(nom);
  if (err){ const e = document.getElementById('err'); if (e){ e.textContent = err; e.classList.add('on'); } return; }
  if (etape < TOTAL){ etape++; rendu(); return; }
  etape = 'res'; ENREGISTRE = null; rendu(); enregistrer();
}

/* Enregistrement sur la fiche : même format qu'une simulation du simulateur,
   origine « client ». Le serveur (edge function rdv, action « budget »)
   retrouve la fiche par le jeton : la page ne connaît jamais l'identifiant. */
function enregistrer(){
  const r = calculer(), cl = r.cl;
  const corps = {
    action: 'budget',
    profil: { projet: cl.projet, revenus: Math.round(cl.revenus), apport: Math.round(cl.apport), duree: cl.duree },
    budgetMax: r.budget != null ? Math.round(r.budget) : null,
    montage: r.montage || null,
    loyerActuel: (R.logement === 'loc' || R.logement === 'hlm') && num(R.loyer) > 0 ? Math.round(num(R.loyer)) : null,
    etat: etatSimulateur(cl),
    reponses: {
      projet: cl.projet, emprunteurs: R.nb || 1, foyer: cl.foyer, logement: R.logement,
      loyer: num(R.loyer) || null, apport: cl.apport, credits: cl.credits, zone: cl.zone,
      situations: R.emp.slice(0, R.nb || 1).map(e => ({ statut: e.statut, revenus: num(e.rev), age: num(e.age), prive: e.prive })),
      parisLoc: R.parisLoc, taux: P.t[cl.duree], tauxDate: TAUX_DATE
    }
  };
  if (params.get("demo") === "1"){ setTimeout(() => { ENREGISTRE = true; if (etape === 'res') rendu(); }, 400); return; }
  fetch(FN, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(corps) })
    .then(x => x.json().catch(() => ({})).then(j => { ENREGISTRE = (j && j.error === 'deja_fait') ? 'deja' : !!(x.ok && j && j.ok); }))
    .catch(() => { ENREGISTRE = false; })
    .then(() => { if (etape === 'res') rendu(); });
}

function chargerTaux(){
  return fetch(SUPA + "/functions/v1/taux-marche", { headers:{ apikey:ANON, Authorization:"Bearer " + ANON } })
    .then(r => r.ok ? r.json() : null)
    .then(d => { if (d && d.t15 != null && d.t20 != null && d.t25 != null){ P.t = {15:d.t15/100, 20:d.t20/100, 25:d.t25/100}; TAUX_DATE = d.date_site || null; } })
    .catch(() => {});
}

function prerremplir(){
  const b = D.bien || {};
  const m = String(b.ville || "").match(/^(.*?)\s*\((\d{5})\)/);
  const z = m ? zoneDepuisCommune(m[1], m[2]) : (b.ville ? zoneDepuisCommune(villeCourte(b.ville), "") : null);
  if (z){ R.zone = z; R.zoneAuto = true; }
}

function erreur(titre, texte){ cont.innerHTML = "<div class='etat-vide'><h2>" + esc(titre) + "</h2><p>" + esc(texte) + "</p></div>"; }

(function demarrer(){
  if (params.get("demo") === "1"){
    D = { prenom:"Camille", vendeur:"Nour", bien:{ typologie:"Appartement 3 pièces", ville:"Bagneux (92220)", prix:289000 } };
    prerremplir(); chargerTaux().then(rendu); return;
  }
  if (!token){ erreur("Lien incomplet", "Ce lien ne contient pas votre code personnel. Utilisez le lien reçu par mail."); return; }
  Promise.all([
    fetch(FN + "?data=1", { cache:"no-store" }).then(r => r.json()),
    chargerTaux()
  ]).then(([d]) => {
    if (!d || d.ok === false){ erreur("Ce lien n'est plus valable", "Demandez un nouveau lien à votre conseiller."); return; }
    D = d;
    // Un budget existe déjà sur la fiche (le sien ou celui du vendeur) : on ne le refait pas (11/11/2026)
    if (d.budgetFait === true){ erreur("Votre budget est déjà prêt", (d.vendeur || "Votre conseiller") + " l'a sous les yeux : vous le reverrez ensemble pendant votre rendez-vous."); return; }
    prerremplir(); rendu();
  }).catch(() => erreur("Page indisponible", "Réessayez dans quelques instants."));
})();
</script>
